name: Daily pre-market report

on:
  schedule:
    # GitHub Actions cron is UTC-only; ET shifts with daylight saving, so we
    # trigger at both candidate times every weekday and let daily_report.py
    # decide (via should_run_now()) which one is actually ~9:25am ET.
    - cron: "30 14 * * 1-5"   # 9:25am ET during EDT (roughly Mar-Nov)
    - cron: "30 15 * * 1-5"   # 9:25am ET during EST (roughly Nov-Mar)
  workflow_dispatch:          # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        # FORCE_RUN=1 only applies to manual (workflow_dispatch) runs, so a
        # manual test always produces output regardless of what time it is.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_RUN=1 python daily_report.py
          else
            python daily_report.py
          fi

      - name: Commit report if one was written
        run: |
          git config user.name "premarket-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Add report $(date -u +%Y-%m-%d)"
          git push
